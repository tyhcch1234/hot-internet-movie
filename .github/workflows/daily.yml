name: Daily trending update

# 每日香港時間 10:00（UTC 02:00）自動抓 Google Trends 熱搜
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-trending
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch Google Trends HK
        run: python3 scripts/fetch_trends.py

      - name: Validate data
        run: python3 scripts/validate.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/videos.json; then
            echo "今日冇新內容，唔需要 commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          git commit -m "chore: 自動收錄 $(TZ=Asia/Hong_Kong date +%F) 香港熱搜"
          git push
