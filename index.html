<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Hot Internet Movie · 每日熱片庫</title>
<meta name="description" content="每日累積的網絡熱門影片：Netflix 官方榜、YouTube 熱片、香港熱搜。一日一頁，愈儲愈多。" />
<style>
  :root{
    --bg:#08080c; --bg2:#0e0e15; --card:#14141d; --card2:#1a1a25;
    --line:#262633; --txt:#f2f2f7; --dim:#9a9aae; --dim2:#6f6f82;
    --red:#ff2d55; --blue:#3b82f6; --purple:#a855f7; --gold:#ffb020;
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(900px 500px at 10% -10%, rgba(255,45,85,.16), transparent 60%),
      radial-gradient(700px 400px at 100% 0%, rgba(59,130,246,.12), transparent 60%),
      var(--bg);
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang HK","Noto Sans HK","Microsoft JhengHei",sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px;margin:0 auto;padding:0 16px 64px}

  header{padding:calc(28px + env(safe-area-inset-top)) 0 14px}
  .brand{display:flex;align-items:center;gap:10px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 12px var(--red)}
  .kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  h1{font-size:clamp(26px,7vw,38px);line-height:1.15;margin:10px 0 6px;letter-spacing:-.02em}
  h1 em{font-style:normal;background:linear-gradient(120deg,var(--red),#ff8a5c);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--dim);font-size:14px;margin:0}

  .stats{display:flex;gap:10px;margin:18px 0 16px;flex-wrap:wrap}
  .stat{flex:1 1 120px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .stat b{display:block;font-size:22px;line-height:1.2}
  .stat span{font-size:11px;color:var(--dim2);letter-spacing:.06em}

  .toolbar{position:sticky;top:0;z-index:20;padding:10px 0 12px;background:linear-gradient(180deg,rgba(8,8,12,.96) 70%,rgba(8,8,12,0));backdrop-filter:blur(8px)}
  .chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--dim);
    padding:8px 14px;border-radius:999px;font-size:13px;cursor:pointer;transition:.18s;white-space:nowrap}
  .chip[aria-pressed="true"]{background:var(--txt);color:#000;border-color:var(--txt);font-weight:600}
  .search{margin-top:10px;position:relative}
  .search input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px 12px 38px;color:var(--txt);font-size:15px;outline:none}
  .search input:focus{border-color:#3a3a4d}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}

  .daygroup{margin-top:26px}
  .dayhead{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
  .dayhead h2{font-size:15px;margin:0;letter-spacing:.02em}
  .dayhead .wk{font-size:12px;color:var(--dim2)}
  .dayhead .cnt{font-size:11px;color:var(--dim2);margin-left:auto}
  .dayhead::before{content:"";width:3px;height:15px;border-radius:2px;background:var(--red)}

  .grid{display:grid;gap:10px}
  @media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}

  .card{position:relative;background:linear-gradient(180deg,var(--card2),var(--card));
    border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 13px;
    display:flex;flex-direction:column;gap:8px;transition:.18s;overflow:hidden}
  .card:hover{border-color:#3a3a4d;transform:translateY(-1px)}
  .card .top{display:flex;align-items:center;gap:8px}
  .rank{font-size:11px;font-weight:700;color:var(--dim2);letter-spacing:.08em}
  .badge{font-size:10.5px;font-weight:700;letter-spacing:.05em;padding:3px 8px;border-radius:6px;text-transform:uppercase}
  .b-Netflix{background:rgba(255,45,85,.16);color:#ff6b85;border:1px solid rgba(255,45,85,.3)}
  .b-YouTube{background:rgba(255,0,51,.14);color:#ff5c74;border:1px solid rgba(255,0,51,.28)}
  .b-網絡{background:rgba(168,85,247,.16);color:#c48bff;border:1px solid rgba(168,85,247,.3)}
  .cat{margin-left:auto;font-size:11px;color:var(--dim2)}
  .title{font-size:16px;font-weight:650;line-height:1.35;margin:0;letter-spacing:-.01em}
  .title a{color:inherit;text-decoration:none}
  .title a:hover{color:#fff;text-decoration:underline;text-underline-offset:3px}
  .metric{font-size:12px;color:var(--gold);font-variant-numeric:tabular-nums}
  .note{font-size:13px;color:var(--dim);line-height:1.5;margin:0;flex:1}
  .src{font-size:10.5px;color:var(--dim2);border-top:1px dashed var(--line);padding-top:8px;margin-top:2px}

  .empty{text-align:center;color:var(--dim2);padding:60px 0;font-size:14px}
  footer{margin-top:40px;border-top:1px solid var(--line);padding-top:16px;color:var(--dim2);font-size:11.5px;line-height:1.7}
  footer a{color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="dot"></span><span class="kicker">Daily digest · 每日累積</span></div>
    <h1>Hot <em>Internet</em> Movie</h1>
    <p class="sub">每日最新興嘅影片同熱話，一日一版，愈儲愈多。</p>
    <div class="stats">
      <div class="stat"><b id="sTotal">–</b><span>累積條目</span></div>
      <div class="stat"><b id="sDays">–</b><span>收錄日數</span></div>
      <div class="stat"><b id="sLatest">–</b><span>最新更新</span></div>
    </div>
  </header>

  <div class="toolbar">
    <div class="chips" id="chips">
      <button class="chip" data-f="all" aria-pressed="true">全部</button>
      <button class="chip" data-f="Netflix" aria-pressed="false">Netflix</button>
      <button class="chip" data-f="YouTube" aria-pressed="false">YouTube</button>
      <button class="chip" data-f="網絡" aria-pressed="false">網絡熱搜</button>
    </div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="搜尋片名、關鍵字…" autocomplete="off" />
    </div>
  </div>

  <main id="list"></main>

  <footer>
    資料來源：Netflix Tudum 官方 Top 10、Google Trends 香港、公開發布平台。<br />
    數字以來源原值為準；標示「Google Trends 熱搜」者為話題熱度，非觀看次數。<br />
    收錄方法見 <a href="./README.md">README</a> · 更新 <span id="fUpdated">–</span>
  </footer>
</div>

<script>
const WEEK = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
let DATA = [], filter = 'all', kw = '';

const el = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function fmtDate(d){
  const [y,m,dd] = d.split('-').map(Number);
  const dt = new Date(y, m-1, dd);
  return { label: `${y}年${m}月${dd}日`, wk: WEEK[dt.getDay()] };
}

function render(){
  const list = DATA
    .filter(x => filter === 'all' || x.platform === filter)
    .filter(x => {
      if(!kw) return true;
      const hay = [x.title, x.note, x.category, x.platform, x.source].join(' ').toLowerCase();
      return hay.includes(kw);
    });

  if(!list.length){
    el('list').innerHTML = '<div class="empty">搵唔到相符嘅片，試下改關鍵字。</div>';
    return;
  }

  const byDate = {};
  list.forEach(x => (byDate[x.date] = byDate[x.date] || []).push(x));

  const html = Object.keys(byDate).sort().reverse().map(date => {
    const items = byDate[date].sort((a,b) => (a.platform+b.category).localeCompare(b.platform+b.category) || a.rank - b.rank);
    const {label, wk} = fmtDate(date);
    return `<section class="daygroup">
      <div class="dayhead"><h2>${label}</h2><span class="wk">${wk}</span><span class="cnt">${items.length} 條</span></div>
      <div class="grid">${items.map(card).join('')}</div>
    </section>`;
  }).join('');

  el('list').innerHTML = html;
}

function card(x){
  return `<article class="card">
    <div class="top">
      <span class="rank">#${x.rank}</span>
      <span class="badge b-${esc(x.platform)}">${esc(x.platform)}</span>
      <span class="cat">${esc(x.category)}</span>
    </div>
    <h3 class="title"><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a></h3>
    <div class="metric">${esc(x.metric || '')}</div>
    <p class="note">${esc(x.note || '')}</p>
    <div class="src">${esc(x.source || '')}</div>
  </article>`;
}

function stats(){
  el('sTotal').textContent = DATA.length;
  const days = [...new Set(DATA.map(x => x.date))];
  el('sDays').textContent = days.length;
  const latest = days.sort().pop() || '–';
  el('sLatest').textContent = latest.slice(5).replace('-','/');
  el('fUpdated').textContent = latest;
}

el('chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if(!b) return;
  [...el('chips').children].forEach(c => c.setAttribute('aria-pressed', String(c === b)));
  filter = b.dataset.f; render();
});

let t;
el('q').addEventListener('input', e => {
  clearTimeout(t);
  t = setTimeout(() => { kw = e.target.value.trim().toLowerCase(); render(); }, 120);
});

fetch('./data/videos.json', {cache:'no-store'})
  .then(r => r.json())
  .then(d => { DATA = d.items || []; stats(); render(); })
  .catch(() => {
    el('list').innerHTML = '<div class="empty">載入資料失敗。</div>';
  });
</script>
</body>
</html>
